<div class="card">
  <div class="card-header">
    <div class="row">
        <div class="col-sm-6"><h3>List of holidays</h3></div>
        <div class="col-sm-6"><button class="btn btn-primary" style="float: right;" (click)="showAddHoliday()">Add holiday</button></div>
    </div>
    
    </div>
  <div class="card-body">
    @for (holiday of holidays_paginated.items; track holiday.id) {
      <div class="row">
        <div class="col-3">{{ holiday.id }}</div>
        <div class="col-3">{{ holiday.title }}</div>
        <div class="col-3">{{ holiday.description }}</div>
        <div class="col-3"><button class="btn btn-warning" style="float: right;" (click)="showDeleteHoliday(holiday.id)">Delete</button></div>
      </div>
    }
  </div>
  <div class="card-footer"></div>
</div>
