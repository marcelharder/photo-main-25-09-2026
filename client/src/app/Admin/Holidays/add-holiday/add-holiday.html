<form #f="ngForm">
  <div class="card">
    <div class="card-header">
      <div class="row">
        <div class="col-sm-6"><h3>Add a holiday</h3></div>
        <div class="col-sm-6">
          <button
            class="btn btn-primary"
            style="float: right"
            (click)="hideAddHoliday()">
            Back
          </button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="card">
        <div class="card-body">
          
    </div>
      </div>
    <div class="card-footer">
      <button
        class="btn btn-warning"
        style="float: right"
        (click)="saveHoliday()"
      >
        Save
      </button>
    </div>
  </div>
  </div>
</form>
