<div class="container">
  <div class="card">

    <!-- HEADER -->
    <div class="card-header">
      <span class="badge bg-secondary fs-5 px-3 py-2">Managing Categories</span>


      <button
        class="btn btn-secondary float-end"
        (click)="addCategory()"
        *ngIf="!showAddPage"
      >
        Add Category
      </button>

      <button
        class="btn btn-outline-secondary float-end"
        (click)="cancelAdd()"
        *ngIf="showAddPage"
      >
        Back
      </button>
    </div>

    <!-- LIST VIEW -->
    <div class="card-body" *ngIf="!showAddPage">
        <div *ngFor="let t of listOfCategories">
          <app-category-list [cat]="t"></app-category-list>
        </div>
    </div>

    <!-- ADD VIEW -->
    <div class="card-body" *ngIf="showAddPage">
      <app-add-category (cancel)="cancelAdd()"></app-add-category>
    </div>

    <!-- FOOTER -->
    <div class="card-footer">
      <small class="text-muted">Last updated 3 mins ago</small>
    </div>

  </div>
</div>
