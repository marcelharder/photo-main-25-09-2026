
<div class="card mb-4">
    <div class="card header">
        <div class="row">

            <div class="class col-sm-4"></div>
            <div class="col-sm-4"><h4><span class="badge bg-secondary">{{video().title}}</span></h4>
            </div>
            <ul class="list-inline member-icons animate text-center">
<li class="list-inline-item">
    <button class="btn btn-primary" click="showDetails()"><i class="fa fa-user"></i></button>
</li>
        </ul>
          
        </div>
        
        
        </div>
    <div class="card-img-wrapper">
        <img [src]="baseUrl + 'Video/ImageThumbnailFile/' + video().id" alt="Video not found" class="card-img-top"/>
        <ul class="list-inline member-icons animate text-center">
<li class="list-inline-item">
    <button class="btn btn-primary" (click)="getVideoFull(video().id)"><i class="fa fa-play"></i></button>
</li>
        </ul>
    </div>
    
    
</div>
