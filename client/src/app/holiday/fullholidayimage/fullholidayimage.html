<div class="card">
  <div class="card-header">
    No of Images: {{ listOfImages.length }}
     <button
              class="btn btn-success btn-sm mr-2"
              style="float: right"
              (click)="backToHolidayList()"
            >
              <i class="fa fa-chevron-up"></i>
            </button>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-sm-1">
        <button
          class="btn btn-primary"
          (click)="leftButtonClicked()"
          *ngIf="showLeftButton()"
        >
          <i class="fa fa-chevron-left"></i>
        </button>
      </div>
      <div class="col-sm-10">
        <img
          [src]="imageUrl"
          alt="Full size holiday image"
          width="100%" height="100%"
        />
      </div>

      <div class="col-sm-1">
        <button
          class="btn btn-primary"
          (click)="rightButtonClicked()"
          *ngIf="showRightButton()"
        >
          <i class="fa fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>
